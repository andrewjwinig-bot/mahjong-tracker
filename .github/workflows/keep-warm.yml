name: Keep backend warm

# Supabase's free tier auto-pauses a project after ~7 days with no activity, and
# a paused backend makes sign-up/sign-in fail with a "can't reach our servers"
# error — a terrible first impression for someone you just shared the app with.
#
# This job pings the database every few days so the project never idles into a
# pause. It uses the PUBLIC anon key (the same one shipped in the web client, so
# it is safe to keep here) and reads a single row, which is enough to register as
# activity. Remove this workflow once the project is on a paid plan (no pausing).
on:
  schedule:
    - cron: '17 13 */3 * *' # every 3 days, 13:17 UTC (offset off the hour)
  workflow_dispatch: {} # allow a manual run from the Actions tab

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase REST (keeps the DB from idling)
        env:
          SUPABASE_URL: https://aqsegpahalablltptfur.supabase.co
          # Public anon key — same value the web app ships to every browser.
          SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImFxc2VncGFoYWxhYmxsdHB0ZnVyIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODIzNzg4MTUsImV4cCI6MjA5Nzk1NDgxNX0.uInK3un2y16mAo9pG5DWF0QSQtXKhc33Iz3XsQrP-lE
        run: |
          set -e
          code=$(curl -s -o /dev/null -w "%{http_code}" \
            "$SUPABASE_URL/rest/v1/profiles?select=id&limit=1" \
            -H "apikey: $SUPABASE_ANON_KEY" \
            -H "Authorization: Bearer $SUPABASE_ANON_KEY")
          echo "Supabase REST responded: HTTP $code"
          # 200 (rows) or 401/403 (RLS blocks the read) all mean the backend is
          # awake and served the request. Only a real outage/5xx or no response
          # should fail the job.
          if [ "$code" -ge 500 ] || [ "$code" = "000" ]; then
            echo "::error::Supabase did not respond healthily (HTTP $code)"
            exit 1
          fi
          echo "Backend is awake."
